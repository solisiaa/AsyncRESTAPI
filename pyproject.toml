[project]
name = "task-analytics-api"
version = "0.1.0"
description = "Async REST API for task tracking and analytics (Jira/Trello-like)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AsyncRESTAPI" }]
dependencies = [
    "fastapi>=0.110,<0.122",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0,<2.1",
    "asyncpg>=0.29",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1,<4.3",
    "redis>=5.0",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis[async]>=2.20",
    "pytest-cov>=5.0",
    "anyio>=4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis[async]>=2.20",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "DTZ", "EM", "PLW"]
ignore = ["EM101", "EM102", "UP045", "UP007", "UP006", "UP035", "UP017", "UP037", "UP036", "B008", "PLW2901", "PLW0603", "PLW0108", "DTZ005", "C901", "ARG001", "ARG002", "SIM105", "S101", "PLR0913"]

[tool.ruff.format]
# line-length inherited from [tool.ruff]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "jose.*",
    "jwt.*",
    "redis.*",
    "fakeredis.*",
    "structlog.*",
    "alembic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "migrations/*", "scripts/*"]
concurrency = ["thread", "greenlet"]
parallel = true

[tool.alembic]
script_location = "migrations"
